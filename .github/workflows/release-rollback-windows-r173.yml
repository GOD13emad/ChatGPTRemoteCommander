name: Core real promotion and rollback R173 (isolated Windows)

on:
  pull_request:
    paths:
      - '.github/workflows/release-rollback-windows-r173.yml'
      - 'test/release-rollback-windows-r173.ps1'
      - 'test/router-ports-windows-r189.ps1'
      - 'tools/run-r157-standard-user.ps1'
      - 'tools/r157-standard-token-probe.mjs'
      - 'auto-update-windows.ps1'
      - 'tools/router-switch.mjs'
      - 'tools/run-owned-process-tree-windows.ps1'
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-rollback-r173-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  windows-real-rollback:
    # Owner dev-train policy 2026-10-28: legacy R173 rollback is not a pre-v1.0 gate.
    # Retain the full rollback qualification for v1.0.0 or an explicit manual run.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.427'
      - name: Build and verify pinned native Job Object runner for R173
        shell: pwsh
        run: ./tools/windows-job-runner/verify-windows-job-runner.ps1 -Ensure
      - name: Static parser, exact source and temporary host guard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ github.event.pull_request.head.sha || github.sha }}'
          if((git rev-parse HEAD).Trim() -ne $sha){throw 'R173_WRONG_CHECKOUT_SHA'}
          $candidateVersion=[string]((Get-Content package.json -Raw|ConvertFrom-Json).version)
          & node.exe tools/isolated-qa-policy.mjs
          if($LASTEXITCODE -ne 0){throw 'R173_UNSUPPORTED_VERSION'}
          $tokens=$null;$errs=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'test/release-rollback-windows-r173.ps1'),[ref]$tokens,[ref]$errs)|Out-Null
          if(@($errs).Count){throw ('R173_PARSER_ERRORS_'+@($errs).Count)}
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'tools/run-r157-standard-user.ps1'),[ref]$tokens,[ref]$errs)|Out-Null
          if(@($errs).Count){throw ('R157_HELPER_PARSER_ERRORS_'+@($errs).Count)}
          if(-not(Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tools/r157-standard-token-probe.mjs') -PathType Leaf)){throw 'R157_NODE_TOKEN_PROBE_MISSING'}
          & node.exe --check (Join-Path $env:GITHUB_WORKSPACE 'tools/r157-standard-token-probe.mjs')
          if($LASTEXITCODE -ne 0){throw 'R157_NODE_TOKEN_PROBE_PARSER'}
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File test/router-ports-windows-r189.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'R189_ROUTER_SCHEMA_NEGATIVE_TESTS_FAILED'}
          $p=Join-Path $env:RUNNER_TEMP 'remote-commander-rollback-r173'
          if(Test-Path $p){throw 'R173_NO_BLIND_RERUN'}
          if(Test-Path (Join-Path $env:LOCALAPPDATA 'ChatGPTRemoteCommander')){throw 'R173_PREEXISTING_INSTALL'}
          $runner=Join-Path $env:GITHUB_WORKSPACE 'tools\windows-job-runner\dist\win-x64\CommanderWindowsJobRunner.exe'
          if(-not(Test-Path -LiteralPath $runner -PathType Leaf)){throw 'R173_PINNED_JOB_RUNNER_MISSING'}
          Write-Output 'R173_STATIC_EXACT_HEAD_PRESTATE_PASS'
      - name: Real candidate promotion and compatible dev23 rollback under standard token
        shell: pwsh
        timeout-minutes: 53
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ github.event.pull_request.head.sha || github.sha }}'
          $root=Join-Path $env:RUNNER_TEMP 'remote-commander-rollback-r173'
          $runner=Join-Path $env:GITHUB_WORKSPACE 'tools\windows-job-runner\dist\win-x64\CommanderWindowsJobRunner.exe'
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File tools/run-r157-standard-user.ps1 -RunR173Rollback -Root $root -Workspace $env:GITHUB_WORKSPACE -ExpectedCommit $sha -InstallDir (Join-Path $root 'INSTALL') -WindowsJobRunnerPath $runner
          if($LASTEXITCODE -ne 0){throw ('R173_STANDARD_USER_NONZERO_'+$LASTEXITCODE)}
          $cleanupPath=Join-Path $root 'R173_STANDARD_USER_CLEANUP.json'
          if(-not(Test-Path -LiteralPath $cleanupPath -PathType Leaf)){throw 'R173_STANDARD_USER_CLEANUP_RECEIPT_MISSING'}
          $cleanup=Get-Content -LiteralPath $cleanupPath -Raw|ConvertFrom-Json
          if($cleanup.revision -ne 'R173_STANDARD_USER_CLEANUP' -or $cleanup.status -ne 'PASS' -or $cleanup.accountCreated -ne $true -or $cleanup.userRemoved -ne $true -or $cleanup.ownedProcesses -ne 0){throw 'R173_STANDARD_USER_CLEANUP_NOT_ACCEPTED'}
          $receipt=Get-Content -LiteralPath (Join-Path $root 'RETURN_R173.json') -Raw|ConvertFrom-Json
          if($receipt.status -ne 'PASS_WINDOWS_REAL_PROMOTION_ROLLBACK_ZERO_OWNED' -or $receipt.candidateHead -ne $sha -or $receipt.rollbackHead -ne '8ccf0fd16355a4ab79844feec6c295366763df0d'){throw 'R173_FINAL_RECEIPT_NOT_ACCEPTED'}
          Write-Output 'R173_STANDARD_USER_AND_COMPATIBLE_ROLLBACK_PASS'
      - name: Upload scoped CI-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r173-windows-promotion-rollback-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/remote-commander-rollback-r173/RETURN_R173.json
            ${{ runner.temp }}/remote-commander-rollback-r173/R173_STANDARD_USER_CLEANUP.json
            ${{ runner.temp }}/remote-commander-rollback-r173/PROMOTE.stdout.log
            ${{ runner.temp }}/remote-commander-rollback-r173/PROMOTE.stderr.log
            ${{ runner.temp }}/remote-commander-rollback-r173/ROLLBACK.stdout.log
            ${{ runner.temp }}/remote-commander-rollback-r173/ROLLBACK.stderr.log
            ${{ runner.temp }}/remote-commander-rollback-r173/ROUTE_PROMOTE.json
            ${{ runner.temp }}/remote-commander-rollback-r173/ROUTE_ROLLBACK.json
