name: Apply v0.9.4 legacy compatibility hotfix

on:
  push:
    branches:
      - hotfix/v0.9.4-legacy-idempotency-r1

permissions:
  contents: write

jobs:
  apply-and-qualify:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Linux GUI helper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-gi gir1.2-gdkpixbuf-2.0 gnome-shell-common
      - name: Align one-shot patcher with current v0.9.4 test order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-v094-legacy-idempotency-hotfix-r2.mjs')
          s=p.read_text()
          old="const needle='test/deferred-coverage.test.mjs test/retry-guard.test.mjs';"
          new="const needle='test/deferred-coverage.test.mjs test/process-tree-lifecycle.test.mjs test/retry-guard.test.mjs';"
          if s.count(old) != 1:
              raise SystemExit(f'needle declaration count={s.count(old)}')
          s=s.replace(old,new)
          old2="pkg.scripts.test=pkg.scripts.test.replace(needle,'test/deferred-coverage.test.mjs test/linux-host-schema-compat.test.mjs test/retry-guard.test.mjs');"
          new2="pkg.scripts.test=pkg.scripts.test.replace(needle,'test/deferred-coverage.test.mjs test/process-tree-lifecycle.test.mjs test/linux-host-schema-compat.test.mjs test/retry-guard.test.mjs');"
          if s.count(old2) != 1:
              raise SystemExit(f'replacement declaration count={s.count(old2)}')
          p.write_text(s.replace(old2,new2))
          PY
      - name: Apply bounded compatibility patch
        run: node tools/apply-v094-legacy-idempotency-hotfix-r2.mjs
      - name: Update deferred-work regression for schema/runtime separation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/deferred-coverage.test.mjs')
          s=p.read_text()
          old="import { powerToolDefinitions } from '../src/power-tools-v0.3.mjs';"
          new="import { powerToolDefinitions } from '../src/power-tools-v0.3.mjs';\nimport { synchronousCommandInput } from '../src/retry-guard.mjs';"
          if s.count(old) != 1:
              raise SystemExit(f'import marker count={s.count(old)}')
          s=s.replace(old,new)
          old2="  assert.equal(max(def(powerToolDefinitions,'run_shell'),'timeoutMs'),15000);"
          new2="  // Keep the advertised schema backward-compatible with cached hosts, while the runtime hard guard remains 15 seconds.\n  assert.equal(max(def(powerToolDefinitions,'run_shell'),'timeoutMs'),30000);\n  assert.throws(() => synchronousCommandInput({timeoutMs:30000}), /SYNCHRONOUS_COMMAND_DEADLINE_RISK/);\n  assert.equal(synchronousCommandInput({timeoutMs:15000}).timeoutMs,15000);"
          if s.count(old2) != 1:
              raise SystemExit(f'assert marker count={s.count(old2)}')
          p.write_text(s.replace(old2,new2))
          PY
      - name: Diff safety
        run: git diff --check
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Security audit
        run: npm run audit
      - name: Commit qualified hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server-v0.3.mjs src/power-tools-v0.3.mjs test/mutation-idempotency-http.test.mjs test/linux-host-schema-compat.test.mjs test/deferred-coverage.test.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve idempotency for cached legacy MCP clients [hotfix-applied]'
          git push origin HEAD:hotfix/v0.9.4-legacy-idempotency-r1
