name: Windows isolated updater NoPromote R157

on:
  pull_request:
    paths:
      - '.github/workflows/windows-updater-e2e-r157.yml'
      - 'auto-update-windows.ps1'
      - 'tools/run-owned-process-tree-windows.ps1'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'config.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-no-promote-r157-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  isolated-windows-updater:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Exact-head preflight and private disposable state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $expected='${{ github.event.pull_request.head.sha || github.sha }}'
          $head=(git rev-parse HEAD).Trim()
          if($expected -notmatch '^[0-9a-f]{40}$' -or $head -ne $expected){throw 'R157_HEAD_DRIFT'}
          $root=Join-Path $env:RUNNER_TEMP 'remote-commander-updater-r157'
          if(Test-Path $root){throw 'R157_NO_BLIND_RERUN'}
          if(Test-Path (Join-Path $env:LOCALAPPDATA 'ChatGPTRemoteCommander')){throw 'R157_EXISTING_USER_INSTALL'}
          foreach($area in @('INSTALL','STATE','ROAMING')){
            New-Item -ItemType Directory -Path (Join-Path $root $area) -ErrorAction Stop | Out-Null
          }
          $c=Get-Content 'config.json' -Raw -Encoding UTF8|ConvertFrom-Json
          if($null -eq $c.autoUpdate -or $null -eq $c.powerMode){throw 'R157_CONFIG_SCHEMA'}
          $c.allowedRoots=@($root)
          $c.autoUpdate.enabled=$true
          $c.powerMode.enabled=$false
          $c.powerMode.guiControl.enabled=$false
          $c.powerMode.browserControl.enabled=$false
          # R161 negative side-effect fixture: a test-only provider tree must survive NoPromote.
          $legacy=Join-Path $root 'STATE\ChatGPTRemoteCommander\tools\codex-cli'
          New-Item -ItemType Directory -Path $legacy -ErrorAction Stop | Out-Null
          $marker=Join-Path $legacy 'R161-PRESERVE.txt'
          [IO.File]::WriteAllText($marker,'R161-NO-PROMOTE-PRESERVE',[Text.UTF8Encoding]::new($false))
          $path=Join-Path $root 'INSTALL\config.json'
          [IO.File]::WriteAllText($path,(ConvertTo-Json -InputObject $c -Depth 30)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          $r=Get-Content $path -Raw|ConvertFrom-Json
          if(@($r.allowedRoots).Count -ne 1 -or $r.allowedRoots[0] -ne $root -or $r.powerMode.enabled -ne $false){throw 'R157_CONFIG_ISOLATION'}
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'auto-update-windows.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -ne 0){throw 'R157_UPDATER_PARSER'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RC_E2E_ROOT=$root"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RC_E2E_SHA=$expected"
          Write-Output ('R157_PREFLIGHT_PASS_HEAD='+$head)

      - name: Actual candidate-first updater in isolated state (NoPromote)
        shell: pwsh
        timeout-minutes: 42
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=[string]$env:RC_E2E_ROOT
          $sha=[string]$env:RC_E2E_SHA
          if(-not $root -or $sha -notmatch '^[0-9a-f]{40}$'){throw 'R157_MISSING_PRESTATE'}
          $env:LOCALAPPDATA=Join-Path $root 'STATE'
          $env:APPDATA=Join-Path $root 'ROAMING'
          $install=Join-Path $root 'INSTALL'
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -File .\auto-update-windows.ps1 -InstallDir $install -SourceRef $sha -ExpectedCommit $sha -TargetProfile default -NoPromote
          if($LASTEXITCODE -ne 0){throw ('R157_UPDATER_FAILED_'+$LASTEXITCODE)}

      - name: Independently verify exact Job receipts and no promotion
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=[string]$env:RC_E2E_ROOT
          $sha=[string]$env:RC_E2E_SHA
          if(-not $root -or $sha -notmatch '^[0-9a-f]{40}$'){throw 'R157_VERIFY_PRESTATE_MISSING'}
          $state=Join-Path $root 'STATE\ChatGPTRemoteCommander'
          $marker=Join-Path $state 'tools\codex-cli\R161-PRESERVE.txt'
          if(-not(Test-Path -LiteralPath $marker -PathType Leaf) -or [IO.File]::ReadAllText($marker) -cne 'R161-NO-PROMOTE-PRESERVE'){throw 'R161_LEGACY_PROVIDER_MUTATED_IN_NOPROMOTE'}
          $reportPath=Join-Path $state 'last-update.json'
          if(-not(Test-Path $reportPath)){throw 'R157_NO_RESULT'}
          $report=Get-Content $reportPath -Raw -Encoding UTF8|ConvertFrom-Json
          if($report.status -ne 'CANDIDATE_PASS' -or [string]$report.commit -ne $sha){throw ('R157_BAD_RESULT_'+$report.status)}
          $profiles=@($report.profiles)
          if($profiles.Count -ne 1 -or $profiles[0].profile -ne 'default' -or $profiles[0].doctor -ne 'PASS' -or $profiles[0].hardware -ne 'PASS' -or $profiles[0].shadowStore -ne 'PASS' -or $profiles[0].liveStoreCompatibility -ne 'PASS'){throw 'R157_PROFILE_GATE_FAIL'}
          $jobs=@(Get-ChildItem (Join-Path $state 'update-logs') -File -Filter 'qualification-job-*.json')
          if($jobs.Count -ne 3){throw ('R157_JOB_COUNT_'+$jobs.Count)}
          foreach($file in $jobs){
            $j=Get-Content $file.FullName -Raw|ConvertFrom-Json
            if($j.status -ne 'PASS' -or $j.childExitCode -ne 0 -or $j.cleanupRequired -ne $false -or $j.timedOut -ne $false -or $j.activeAfterCleanup -ne 0){throw ('R157_JOB_NOT_ACCEPTED_'+$file.Name)}
          }
          $routePath=Join-Path $state 'routing'
          if(Test-Path $routePath){
            $routes=@(Get-ChildItem $routePath -Filter '*.json' -File|Where-Object{$_.Name -notlike '*.runtime.json'})
            if($routes.Count -gt 0){throw 'R157_UNEXPECTED_ROUTE_PROMOTION'}
          }
          $leftover=@(Get-CimInstance Win32_Process -Filter "Name='node.exe'"|Where-Object {([string]$_.CommandLine).Contains($root)})
          if($leftover.Count -gt 0){throw ('R157_ORPHANS_'+$leftover.Count)}
          $stage=Join-Path $state ('releases\v0.10.21-'+$sha.Substring(0,12))
          if(-not(Test-Path $stage) -or (git -C $stage rev-parse HEAD).Trim() -ne $sha){throw 'R157_EXACT_STAGE_MISSING'}
          $receipt=[ordered]@{schema=1;revision='R157';status='PASS_HOSTED_WINDOWS_UPDATER_NOPROMOTE'
            exactCommit=$sha;qualifierReceipts=3;doctor='PASS';shadowStore='PASS'
            liveStoreCompatibility='PASS';ownedChildren=0;promoted=$false;stableBrowserUntouched=$true
            verifiedUtc=[DateTime]::UtcNow.ToString('o')}
          $dest=Join-Path $root 'RETURN_R157.json'
          [IO.File]::WriteAllText($dest,(ConvertTo-Json -InputObject $receipt -Depth 5)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Output ('R157_PASS source='+$sha+' receiptSha='+(Get-FileHash $dest -Algorithm SHA256).Hash)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '**R157 PASS:** Exact-head Windows candidate-first NoPromote E2E, 3 owned qualification suites, Doctor/Store PASS, no route promotion or owned child leaks.'

      - name: Prepare bounded redacted R209 failure diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=[string]$env:RC_E2E_ROOT
          if(-not $root){Write-Output 'R209_NO_PRESTATE_AVAILABLE';exit 0}
          $temp=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([char]92)+'\'
          if(-not [IO.Path]::GetFullPath($root).StartsWith($temp,[StringComparison]::OrdinalIgnoreCase)){throw 'R209_PATH_OUTSIDE_RUNNER_TEMP'}
          $state=Join-Path $root 'STATE\ChatGPTRemoteCommander'
          $logs=Join-Path $state 'update-logs'
          if(-not(Test-Path $logs -PathType Container)){Write-Output 'R209_NO_LOGS';exit 0}
          $files=@(Get-ChildItem $logs -File -Filter 'qualification-output-qualification-test-*.stdout.log')
          $errorLogs=@(Get-ChildItem $logs -File -Filter 'qualification-output-qualification-test-*.stderr.log')
          $tail=@()
          if($files.Count -eq 1){
            $tail=@(Get-Content $files[0].FullName -Tail 105 -ErrorAction Stop | ForEach-Object {
              $row=[string]$_
              $row=$row -replace '(?i)sk-[a-z0-9_-]{16,}','[REDACTED]'
              $row=$row -replace '(?i)gh[pousr]_[a-z0-9]{16,}','[REDACTED]'
              $row=$row -replace '(?i)Bearer\s+[a-z0-9._-]+','Bearer [REDACTED]'
              $row=$row -replace '(?i)(api[_-]?key|access[_-]?token|refresh[_-]?token|password|secret)\s*[=:]\s*\S+','$1=[REDACTED]'
              $row.Substring(0,[Math]::Min(400,$row.Length))
            })
          }
          $failed=Join-Path $state 'qualification-failure.json'
          $report=Join-Path $state 'last-update.json'
          $record=[ordered]@{
            revision='R209';sourceCommit=$env:RC_E2E_SHA
            status='CI_QUALIFICATION_FAILED_DIAGNOSTIC_ONLY'
            gateLogCount=$files.Count;stderrLogCount=$errorLogs.Count
            stdoutSha256=if($files.Count -eq 1){(Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()}else{$null}
            stderrSha256=if($errorLogs.Count -eq 1){(Get-FileHash $errorLogs[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()}else{$null}
            qualificationFailureReceiptSha256=if(Test-Path $failed){(Get-FileHash $failed -Algorithm SHA256).Hash.ToLowerInvariant()}else{$null}
            updaterReceiptSha256=if(Test-Path $report){(Get-FileHash $report -Algorithm SHA256).Hash.ToLowerInvariant()}else{$null}
            boundedRedactedTail=$tail
            productionHostTouched=$false
          }
          $path=Join-Path $root 'R209_FAILURE_DIAG.json'
          if(Test-Path $path){throw 'R209_NO_BLIND_DIAGNOSTIC_OVERWRITE'}
          [IO.File]::WriteAllText($path,((ConvertTo-Json -InputObject $record -Depth 6)+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Write-Output ('R209_DIAGNOSTIC_SHA='+(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant())

      - name: Preserve sanitized R209 failure evidence (no raw secrets)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r209-isolated-windows-test-diagnostics
          path: ${{ runner.temp }}/remote-commander-updater-r157/R209_FAILURE_DIAG.json
          retention-days: 14
          if-no-files-found: warn
