name: RC013 V2 immutable route QA (NoPromote)
on:
  pull_request:
    paths:
      - 'src/v2-routing-contract.mjs'
      - 'test/v2-route-immutable.test.mjs'
      - 'test/v2-primary-writer-admission.test.mjs'
      - '.github/workflows/rc013-v2-route-immutable-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-route:
    name: immutable route (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --check src/v2-routing-contract.mjs
      - run: node --check test/v2-route-immutable.test.mjs
      - run: node --test test/v2-route-immutable.test.mjs test/v2-primary-writer-admission.test.mjs
