name: Apply GNOME X11 permanent stability fix

on:
  push:
    branches:
      - fix/gnome-x11-lifecycle-20260926

permissions:
  contents: write

jobs:
  apply-and-qualify:
    if: ${{ !contains(github.event.head_commit.message, '[gnome-x11-final-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Linux GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-gi gir1.2-gdkpixbuf-2.0 gnome-shell-common
      - name: Apply combined X11 and lifecycle guard
        run: |
          set -euo pipefail
          BASE_GUARD=4f07fb95823d5583c05e8251b7d6f3db69ec42cd
          git show "$BASE_GUARD:gnome-extension/chatgpt-remote-commander@god13emad/extension.js" > gnome-extension/chatgpt-remote-commander@god13emad/extension.js
          git show "$BASE_GUARD:test/linux-gui-x11-observe-only.test.mjs" > test/linux-gui-x11-observe-only.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json

          meta = Path('gnome-extension/chatgpt-remote-commander@god13emad/metadata.json')
          m = json.loads(meta.read_text())
          m['description'] = 'Headless GNOME Shell GUI backend for ChatGPT Remote Commander with frame-guarded desktop control.'
          m['version'] = max(2, int(m.get('version', 1)))
          meta.write_text(json.dumps(m, indent=2) + '\n')

          updater = Path('auto-update-linux.sh')
          s = updater.read_text()
          old = '''  if version_gt "$ACTIVE_VERSION" "$VERSION"; then
            log "AUTO_UPDATE_NEWER_CURRENT current=$ACTIVE_VERSION latest=$VERSION"
            exit 0
          fi
          if [[ "$ACTIVE_COMMIT" == "$COMMIT" ]]; then'''
          new = '''  if version_gt "$ACTIVE_VERSION" "$VERSION"; then
            log "AUTO_UPDATE_NEWER_CURRENT current=$ACTIVE_VERSION latest=$VERSION"
            exit 0
          fi
          if [[ -z "$SOURCE_REF" && "$ACTIVE_VERSION" == "$VERSION" && "$ACTIVE_COMMIT" != "$COMMIT" ]]; then
            log "AUTO_UPDATE_SAME_VERSION_COMMIT_HOLD current=$ACTIVE_COMMIT latest=$COMMIT version=$ACTIVE_VERSION"
            exit 0
          fi
          if [[ "$ACTIVE_COMMIT" == "$COMMIT" ]]; then'''
          if s.count(old) != 1:
              raise SystemExit(f'updater patch point count={s.count(old)}')
          updater.write_text(s.replace(old, new))

          test = Path('test/auto-update-same-version-hold.test.mjs')
          test.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const source = fs.readFileSync('auto-update-linux.sh', 'utf8');
          test('automatic updater holds a qualified same-version different commit', () => {
            assert.match(source, /AUTO_UPDATE_SAME_VERSION_COMMIT_HOLD/);
            const hold = source.indexOf('AUTO_UPDATE_SAME_VERSION_COMMIT_HOLD');
            const sameCommit = source.indexOf('if [[ \"$ACTIVE_COMMIT\" == \"$COMMIT\" ]]');
            assert.ok(hold > 0 && sameCommit > hold);
            assert.match(source, /-z \"\$SOURCE_REF\" && \"\$ACTIVE_VERSION\" == \"\$VERSION\" && \"\$ACTIVE_COMMIT\" != \"\$COMMIT\"/);
          });
          """)

          package = Path('package.json')
          p = json.loads(package.read_text())
          additions = ['test/auto-update-same-version-hold.test.mjs', 'test/linux-gui-x11-observe-only.test.mjs']
          for key in ('check', 'test'):
              script = p['scripts'][key]
              marker = 'test/auto-update-contract.test.mjs'
              if marker not in script:
                  raise SystemExit(f'{key} marker missing')
              for item in additions:
                  if item not in script:
                      script = script.replace(marker, marker + ' ' + item, 1)
              p['scripts'][key] = script
          package.write_text(json.dumps(p, indent=2) + '\n')
          PY
      - name: Static safety checks
        run: |
          bash -n auto-update-linux.sh
          node --check gnome-extension/chatgpt-remote-commander@god13emad/extension.js
          git diff --check
          node --test test/linux-gui-x11-observe-only.test.mjs test/auto-update-same-version-hold.test.mjs
      - name: Full check
        run: npm run check
      - name: Full test
        run: npm test
      - name: Security audit
        run: npm run audit
      - name: Commit qualified permanent fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add auto-update-linux.sh package.json \
            gnome-extension/chatgpt-remote-commander@god13emad/extension.js \
            gnome-extension/chatgpt-remote-commander@god13emad/metadata.json \
            test/linux-gui-x11-observe-only.test.mjs \
            test/auto-update-same-version-hold.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix(linux): make GNOME X11 stability guard permanent [gnome-x11-final-applied]'
          git push origin HEAD:fix/gnome-x11-lifecycle-20260926
