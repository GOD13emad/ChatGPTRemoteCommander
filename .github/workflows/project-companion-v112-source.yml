name: Finite Project Companion 1.1.2 Source
on:
  push:
    paths:
      - 'experimental/project-companion-v1.1.2/**'
      - '.github/workflows/project-companion-v112-source.yml'
  pull_request:
    paths:
      - 'experimental/project-companion-v1.1.2/**'
      - '.github/workflows/project-companion-v112-source.yml'
permissions:
  contents: read
jobs:
  pure-source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Pinned syntax and exactly 94 synthetic contracts
        working-directory: experimental/project-companion-v1.1.2
        run: node ci-source.mjs
