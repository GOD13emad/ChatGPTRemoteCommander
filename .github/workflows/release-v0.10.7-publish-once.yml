name: Publish v0.10.7 release once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.10.7-publish-once.yml'

permissions:
  contents: write

jobs:
  publish-qualified-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify exact accepted target
        shell: bash
        env:
          TARGET_COMMIT: 3e87325590f2a5f907e899377a6bcd9013d219cd
          TARGET_TREE: 92c61ee299b8335b9e484473bccfa95defb96d2c
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_COMMIT^{commit}"
          test "$(git rev-parse "$TARGET_COMMIT^{tree}")" = "$TARGET_TREE"
          test "$(git show "$TARGET_COMMIT:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "0.10.7"
          git cat-file -e "$TARGET_COMMIT:docs/RELEASE_0.10.7.md"

      - name: Checkout exact accepted target
        shell: bash
        run: git checkout --detach 3e87325590f2a5f907e899377a6bcd9013d219cd

      - name: Build immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-release-assets.sh dist/release
          (cd dist/release && sha256sum -c SHA256SUMS.txt)
          count=$(find dist/release -maxdepth 1 -type f | wc -l)
          test "$count" -eq 19

      - name: Publish exact v0.10.7 release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.10.7
          target=3e87325590f2a5f907e899377a6bcd9013d219cd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{}")" = "$target"
          else
            git tag -a "$tag" "$target" -m "Remote Commander v0.10.7"
            git push origin "refs/tags/$tag"
          fi
          mapfile -t assets < <(find dist/release -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)
          test "${#assets[@]}" -eq 19
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS"
            exit 0
          fi
          gh release create "$tag" "${assets[@]}" --repo "$GH_REPO" --verify-tag --title "Remote Commander $tag" --notes-file docs/RELEASE_0.10.7.md
          gh release view "$tag" --repo "$GH_REPO" --json tagName,isDraft,isPrerelease,url
