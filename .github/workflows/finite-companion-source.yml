name: Finite Companion Source

on:
  push:
    paths:
      - 'experimental/finite-companion-v1.0.0/**'
      - '.github/workflows/finite-companion-source.yml'
  pull_request:
    paths:
      - 'experimental/finite-companion-v1.0.0/**'
      - '.github/workflows/finite-companion-source.yml'

permissions:
  contents: read

jobs:
  public-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Self-contained source contracts (no model or installed host)
        working-directory: experimental/finite-companion-v1.0.0
        run: npm test
      - name: Compile native guard (no enrollment or runtime activation)
        working-directory: experimental/finite-companion-v1.0.0
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
