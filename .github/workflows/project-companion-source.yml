name: Finite Project Companion Source

on:
  push:
    paths:
      - 'experimental/project-companion-v1.1.1/**'
      - '.github/workflows/project-companion-source.yml'
  pull_request:
    paths:
      - 'experimental/project-companion-v1.1.1/**'
      - '.github/workflows/project-companion-source.yml'

permissions:
  contents: read

jobs:
  pure-source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Pinned parser and exact 88 synthetic contracts only
        working-directory: experimental/project-companion-v1.1.1
        run: node ci-source.mjs
