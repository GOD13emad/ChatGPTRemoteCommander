name: Project Companion 1.1.0 Source

on:
  push:
    paths:
      - 'experimental/project-companion-v1.1.0/**'
      - '.github/workflows/project-companion-source.yml'
  pull_request:
    paths:
      - 'experimental/project-companion-v1.1.0/**'
      - '.github/workflows/project-companion-source.yml'

permissions:
  contents: read

jobs:
  finite-project-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing repository authority
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; existing repository authority
        with:
          node-version: '24'
      - name: Syntax only (no dependencies, models, host, or installation)
        working-directory: experimental/project-companion-v1.1.0
        run: npm run check
      - name: Finite catalog and durable state synthetic regression
        working-directory: experimental/project-companion-v1.1.0
        run: node ci-source.mjs
