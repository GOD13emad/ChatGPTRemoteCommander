name: Server Install Canary
# v0.10.4 final exact-tree canary trigger; no runtime semantics.

on:
  pull_request:
    paths:
      - 'install.ps1'
      - 'install.sh'
      - 'server-install-windows.ps1'
      - 'server-install-linux.sh'
      - 'test/installer-check.mjs'
      - 'package.json'
      - 'docs/release-train-0.11.json'
      - 'docs/release-train-0.12.json'
      - '.github/workflows/server-install-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RC_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  RC_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-server-bootstrap:
    # This privileged canary must never run attacker-controlled fork PR installers.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      # The bootstrap must build a pinned native Job Object binary when
      # no installed runner exists; Node/Git are the tools intentionally hidden.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.427'
      # The installation canary deliberately hides Node/Git from PATH. Retain
      # only a pinned Python 3 fixture interpreter to validate Linux release
      # train semantics from the Windows-installed candidate; no system install.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exercise Windows Server bootstrap with Node/Git absent from PATH
        shell: pwsh
        env:
          RC_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:GITHUB_WORKSPACE 'server-install-windows.ps1'
          $expectedVersion=(Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'package.json') -Raw | ConvertFrom-Json).version
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]::new($identity)
          if(-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'HOSTED_RUNNER_NOT_ADMIN'}
          $oldMachine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $oldUser=[Environment]::GetEnvironmentVariable('Path','User')
          try {
            $pythonHome=[string]$env:pythonLocation
            $pythonExe=Join-Path $pythonHome 'python.exe'
            if(-not $pythonHome -or -not(Test-Path -LiteralPath $pythonExe -PathType Leaf)){
              throw 'HOSTED_PYTHON3_FIXTURE_NOT_PROVISIONED'
            }
            & $pythonExe -c 'import sys; raise SystemExit(0 if sys.version_info.major == 3 else 1)'
            if($LASTEXITCODE -ne 0){throw 'HOSTED_PYTHON3_FIXTURE_INVALID'}
            $minimal="$pythonHome;$env:ProgramFiles\PowerShell\7;$env:ProgramFiles\dotnet;$env:windir\System32;$env:windir;$env:windir\System32\Wbem"
            [Environment]::SetEnvironmentVariable('Path',$minimal,'Machine')
            [Environment]::SetEnvironmentVariable('Path',$null,'User')
            $env:Path=$minimal
            if(Get-Command node.exe -ErrorAction SilentlyContinue){throw 'NODE_SHOULD_BE_HIDDEN_FOR_CANARY'}
            if(Get-Command git.exe -ErrorAction SilentlyContinue){throw 'GIT_SHOULD_BE_HIDDEN_FOR_CANARY'}
            $installDir=Join-Path $env:RUNNER_TEMP 'rc-server-app'
            & $script -SourceRef $env:RC_SOURCE_REF -ExpectedCommit $env:RC_EXPECTED_COMMIT -InstallDir $installDir -NoStartServer -GuiControl Off
            $manifestPath=Join-Path $env:ProgramData 'ChatGPTRemoteCommander\server-install-allowlist.json'
            $devMatch=[regex]::Match($expectedVersion,'^0\.(?<minor>11|12)\.0-dev\.[1-9][0-9]*$')
            if($devMatch.Success){
              if(Test-Path -LiteralPath $manifestPath){throw 'DEV_PRODUCTION_ALLOWLIST_MUST_NOT_EXIST'}
              $trainVersion='0.'+$devMatch.Groups['minor'].Value
              $trainPath=Join-Path $installDir ("docs/release-train-$trainVersion.json")
              if(-not(Test-Path -LiteralPath $trainPath -PathType Leaf)){throw 'DEV_MANIFEST_MISSING'}
              $train=Get-Content -LiteralPath $trainPath -Raw | ConvertFrom-Json
              if($train.train -cne $trainVersion -or $train.sourceVersion -cne $expectedVersion -or
                 $train.status -cne 'INTEGRATION_CANDIDATE_NOT_FINAL' -or
                 $train.channel -cne 'development' -or
                 $train.isStable -ne $false -or $train.publishApproved -ne $false -or
                 $train.autoupdateApproved -ne $false -or $train.installedPromotionApproved -ne $false -or
                 $null -ne $train.releaseTag -or
                 @($train.components|Where-Object {$_.required -ne $true -or $_.verified -ne $false}).Count -ne 0 -or
                 @($train.acceptance.PSObject.Properties|Where-Object {$_.Value -ne $false}).Count -ne 0){
                   throw 'DEV_MANIFEST_NO_PROMOTION_POLICY_INVALID'
              }
              Write-Output 'WINDOWS_SERVER_DEV_NOPROMOTE_MANIFEST_PASS'
            } elseif($expectedVersion -notmatch '^\d+\.\d+\.\d+$'){
              throw 'SERVER_CANARY_UNKNOWN_VERSION_DENIED'
            } else {
              $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
              if($manifest.resolvedCommit -ne $env:RC_EXPECTED_COMMIT){throw 'MANIFEST_COMMIT_MISMATCH'}
              if($manifest.antivirusExclusionsAdded -ne $false){throw 'ANTIVIRUS_EXCLUSION_POLICY_VIOLATION'}
              $names=@($manifest.artifacts | ForEach-Object {$_.name})
              if($names -notcontains 'Node.js'){throw 'NODE_BOOTSTRAP_NOT_EVIDENCED'}
              if($names -notcontains 'Git for Windows'){throw 'GIT_BOOTSTRAP_NOT_EVIDENCED'}
            }

            $pkg=Get-Content -LiteralPath (Join-Path $installDir 'package.json') -Raw | ConvertFrom-Json
            if($pkg.version -ne $expectedVersion){throw 'INSTALLED_VERSION_MISMATCH'}
            Write-Output 'WINDOWS_DISPOSABLE_SERVER_CANARY_PASS'
          } finally {
            [Environment]::SetEnvironmentVariable('Path',$oldMachine,'Machine')
            [Environment]::SetEnvironmentVariable('Path',$oldUser,'User')
          }

  linux-clean-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Exercise Linux bootstrap in clean Ubuntu container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -e RC_SOURCE_REF="$RC_SOURCE_REF"             -e RC_EXPECTED_COMMIT="$RC_EXPECTED_COMMIT"             -v "$GITHUB_WORKSPACE:/src:ro"             ubuntu:24.04 bash -lc '
              set -euo pipefail
              # Mirror the Linux CI helper dependency used by the D-Bus/Portal
              # contract tests. This is isolated QA-only setup, not a desktop
              # permission grant or a production GUI activation.
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends python3-gi gir1.2-glib-2.0
              python3 -c "import gi; from gi.repository import Gio, GLib; print(\"LINUX_PORTAL_GI_QA_PREREQUISITE_PASS\")"
              bash /src/server-install-linux.sh                 --source-ref "$RC_SOURCE_REF"                 --expected-commit "$RC_EXPECTED_COMMIT"                 --install-dir /opt/chatgpt-remote-commander/app                 --no-start
              test "$(git -C /opt/chatgpt-remote-commander/app rev-parse HEAD)" = "$RC_EXPECTED_COMMIT"
              command -v python3 >/dev/null
              expected_version="$(sed -nE '"'"'s/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p'"'"' /src/package.json | head -n1)"
              actual_version="$(/opt/chatgpt-remote-commander/app/.runtime/node-current/bin/node -p "require('"'"'/opt/chatgpt-remote-commander/app/package.json'"'"').version")"
              test "$actual_version" = "$expected_version"
              echo LINUX_DISPOSABLE_SERVER_CANARY_PASS
            '
