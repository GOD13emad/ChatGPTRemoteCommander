name: Release Sync

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.3 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
      - name: Build single-file Windows setup
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          pwsh.exe -NoLogo -NoProfile -File .\installer\build-setup.ps1 `
            -VersionOverride $version `
            -SourceRef '${{ github.ref_name }}' `
            -ExpectedCommit '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-commander-windows-setup
          path: dist/installer/Remote-Commander-Setup-v*.exe
          if-no-files-found: error

  publish:
    needs: build-windows-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-release-assets.sh dist/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remote-commander-windows-setup
          path: dist/windows-setup
      - name: Add verified single-file Windows setup
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          setup="dist/windows-setup/Remote-Commander-Setup-v${version}.exe"
          test -f "$setup"
          cp "$setup" "dist/release/Remote-Commander-Setup-v${version}.exe"
          (
            cd dist/release
            sha256sum "Remote-Commander-Setup-v${version}.exe" >> SHA256SUMS.txt
            LC_ALL=C sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - name: Publish matching qualified tag with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          notes="docs/RELEASE_${version}.md"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "RELEASE_SYNC_SKIP tag_missing=$tag"
            exit 0
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "RELEASE_SYNC_ALREADY_PUBLISHED tag=$tag"
            exit 0
          fi
          test -f "$notes"
          (cd dist/release && sha256sum -c SHA256SUMS.txt)
          mapfile -t assets < <(find dist/release -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)
          test "${#assets[@]}" -eq 20
          gh release create "$tag" "${assets[@]}" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "Remote Commander $tag" \
            --notes-file "$notes"
          echo "RELEASE_SYNC_PUBLISHED tag=$tag assets=${#assets[@]}"
