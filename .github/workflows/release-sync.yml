name: Release Sync

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-release-assets.sh dist/release
      - name: Publish matching qualified tag with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          notes="docs/RELEASE_${version}.md"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "RELEASE_SYNC_SKIP tag_missing=$tag"
            exit 0
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "RELEASE_SYNC_ALREADY_PUBLISHED tag=$tag"
            exit 0
          fi
          test -f "$notes"
          (cd dist/release && sha256sum -c SHA256SUMS.txt)
          mapfile -t assets < <(find dist/release -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)
          test "${#assets[@]}" -eq 15
          gh release create "$tag" "${assets[@]}"             --repo "$GH_REPO"             --verify-tag             --title "Remote Commander $tag"             --notes-file "$notes"
          echo "RELEASE_SYNC_PUBLISHED tag=$tag assets=${#assets[@]}"
