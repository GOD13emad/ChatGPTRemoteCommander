name: Native private workspace coordination QA (NoPromote)

on:
  pull_request:
    paths:
      - 'src/native-workspace-coordinator.mjs'
      - 'src/native-workspace-approval.mjs'
      - 'src/native-workspace-journal.mjs'
      - 'src/native-private-x11-app-worker.mjs'
      - 'tools/native-qa-parent-death-exec.py'
      - 'test/native-private-x11-app-worker.test.mjs'
      - 'test/fixture-native-generic-app-abrupt-exit.mjs'
      - 'tools/native-workspace-peer-broker-qa.py'
      - 'test/native-workspace-peer-broker-qa.test.py'
      - 'test/native-workspace-coordinator*.test.mjs'
      - 'test/native-workspace-approval.test.mjs'
      - 'test/native-workspace-journal.test.mjs'
      - 'test/native-workspace-hardening-review.test.mjs'
      - 'test/native-workspace-journal-windows-failclosed.test.mjs'
      - 'src/native-*win*qa.mjs'
      - 'test/native-*win*qa.test.mjs'
      - 'test/native-uia-private-observer-win-qa.test.mjs'
      - 'tools/native-uia-owned-*-win-qa.ps1'
      - 'tools/native-*win*qa.*'
      - 'tools/native-workspace-*-qa.mjs'
      - 'test/gui-private-x11-isolation-qa.py'
      - '.github/workflows/native-private-workspace-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Pure coordinator contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and scoped identity, lease, handoff, no-replay regressions
        run: |
          node --check src/native-workspace-coordinator.mjs
          node --check src/native-private-x11-app-worker.mjs
          node --check src/native-workspace-approval.mjs
          node --check test/native-workspace-approval.test.mjs
          node --check test/native-workspace-coordinator.test.mjs
          node --check src/native-workspace-journal.mjs
          node --check test/native-workspace-journal.test.mjs
          node --check test/native-workspace-hardening-review.test.mjs
          node --check test/native-uia-private-observer-win-qa.test.mjs
          node --check test/native-workspace-journal-windows-failclosed.test.mjs
          node --test test/native-workspace-coordinator.test.mjs test/native-workspace-approval.test.mjs test/native-workspace-hardening-review.test.mjs
      - name: Windows journal must reject native effects without verified durability
        if: matrix.os == 'windows-latest'
        run: node --test test/native-workspace-journal-windows-failclosed.test.mjs
      - name: Windows SQLite intent journal and simulated cross-session broker (NoPromote)
        if: matrix.os == 'windows-latest'
        run: |
          node --check src/native-workspace-journal-win-sqlite-qa.mjs
          node --check src/native-workspace-session-broker-win-qa.mjs
          node --check src/native-workspace-worker-pool-win-qa.mjs
          node --test --test-concurrency=1 test/native-workspace-journal-win-sqlite-qa.test.mjs test/native-workspace-session-broker-win-qa.test.mjs test/native-workspace-worker-pool-win-qa.test.mjs
      - name: Parse private-Desktop UIA QA PowerShell without launching GUI (NoPromote)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('tools/native-uia-owned-child-win-qa.ps1','tools/native-uia-owned-host-win-qa.ps1')){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $name),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){ throw ('UIA_QA_PARSE_FAILED '+$name) }
          }
          Write-Output 'QA_UIA_SOURCE_SYNTAX_ONLY__NO_DESKTOP_INPUT_OR_PROMOTION'
      - name: Linux exact-disk native intent and process-exit no-replay tests
        if: matrix.os == 'ubuntu-24.04'
        run: node --test test/native-workspace-journal.test.mjs

  peercred-linux:
    name: Linux SO_PEERCRED transport QA (NoPromote, no native input)
    runs-on: ubuntu-24.04
    needs: contract
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and actual isolated Linux peer credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tools/native-workspace-peer-broker-qa.py \
            test/native-workspace-peer-broker-qa.test.py
          python3 -B test/native-workspace-peer-broker-qa.test.py
      - name: Enforce no operational native GUI authorization
        run: |
          echo 'SO_PEERCRED_PROVES_OS_PID_UID_GID_ONLY__NOT_CHAT_IDENTITY_OR_OWNER_CONSENT'
          echo 'NO_NATIVE_GUI_INPUT__NO_PRODUCTION_BROKER__NO_ROLLOUT'

  private-x11:
    name: Linux actual Xvfb worker handoff (source QA only)
    runs-on: ubuntu-24.04
    needs: contract
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install disposable native X11 QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils xdotool ffmpeg python3-tk x11-apps zenity
      - name: Exercise two private X servers without owner desktop or network input
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/Xvfb
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/xdotool
          env -u DISPLAY -u WAYLAND_DISPLAY \
            RC_QA_XVFB_BIN=/usr/bin/Xvfb \
            timeout --signal=TERM --kill-after=6s 95s \
            node --test test/native-workspace-coordinator-xvfb.test.mjs
      - name: Exercise arbitrary native X11 programs, pointer and keyboard without browser
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/zenity
          test -x /usr/bin/xclock
          python3 -B -m py_compile tools/native-qa-parent-death-exec.py
          env -u DISPLAY -u WAYLAND_DISPLAY \
            RC_QA_XVFB_BIN=/usr/bin/Xvfb \
            timeout --signal=TERM --kill-after=6s 95s \
            node --test test/native-private-x11-app-worker.test.mjs
      - name: State NoPromote boundary
        run: |
          echo 'SOURCE_ONLY_QA_PASS_IS_NOT_INSTALLATION_OR_NATIVE_OWNER_AUTH'
          echo 'GENERIC_X11_GUI_IS_NOT_VM_RDS_WAYLAND_OR_WINDOWS_PRODUCTION'
