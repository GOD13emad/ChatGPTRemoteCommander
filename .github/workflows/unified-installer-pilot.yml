name: Unified Installer Pilot (isolated trust-export diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-trust-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify official production TUF material
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gh --version | head -1
          gh attestation trusted-root --verify-only
          mkdir -m 700 "$RUNNER_TEMP/rc012-public-trust"
          gh attestation trusted-root > "$RUNNER_TEMP/rc012-public-trust/trusted_root.jsonl"
          python3 - "$RUNNER_TEMP/rc012-public-trust/trusted_root.jsonl" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          assert 0 < p.stat().st_size < 1048576
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert rows and all(isinstance(x,dict) and 'mediaType' in x and isinstance(x.get('certificateAuthorities'),list) for x in rows)
          print('OFFICIAL_TUF_EXPORT_RECORDS='+str(len(rows)))
          PY
          cd "$RUNNER_TEMP/rc012-public-trust"
          sha256sum trusted_root.jsonl | tee SHA256SUMS
          echo RC012_OFFICIAL_TUF_EXPORT_ONLY_NO_PROMOTE
      - name: Preserve public verification metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc012-official-production-trust-diagnostic
          path: |
            ${{ runner.temp }}/rc012-public-trust/trusted_root.jsonl
            ${{ runner.temp }}/rc012-public-trust/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
