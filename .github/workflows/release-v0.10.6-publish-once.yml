name: Publish v0.10.6 release once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.10.6-publish-once.yml'

permissions:
  contents: write

jobs:
  publish-qualified-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.10.6
          fetch-depth: 0
      - name: Verify exact accepted target
        shell: bash
        env:
          TARGET_COMMIT: 3546256e8e7c494d140bc9c33259ddbf345639d3
          TARGET_TREE: cce09e13b834c17a055b3448e808089966e1125a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(node -p "require('./package.json').version")" = "0.10.6"
          test -f docs/RELEASE_0.10.6.md
      - name: Build immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-release-assets.sh dist/release
      - name: Publish verified v0.10.6 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.10.6
          notes=docs/RELEASE_0.10.6.md
          git fetch --force --tags origin
          test "$(git rev-parse "$tag^{}")" = "3546256e8e7c494d140bc9c33259ddbf345639d3"
          (cd dist/release && sha256sum -c SHA256SUMS.txt)
          mapfile -t assets < <(find dist/release -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)
          test "${#assets[@]}" -eq 19
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_PUBLISHED tag=$tag"
            exit 0
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "Remote Commander $tag" \
            --notes-file "$notes"
          echo "RELEASE_PUBLISHED tag=$tag assets=${#assets[@]}"